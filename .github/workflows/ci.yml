name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    # Type checking and formatting do not vary with the Python version, so
    # they run once rather than across the matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy vertebra_xray_core

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  figures:
    # The figures are the paper's numbers in visual form, so a change that
    # stops them rendering is a change that stops the paper reproducing.
    # Only the phantom figures are built here; the VerSe figure needs a
    # dataset that is not redistributed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,figures]"
      - run: python tools/make_figures.py --out /tmp/figures
      - name: Check every phantom figure was written
        run: |
          for f in fig1_landmarks fig2_pedicles fig4_planes fig5_axial_rotation \
                   fig6_kyphosis fig7_uncertainty; do
            test -s "/tmp/figures/$f.png" || { echo "missing $f.png"; exit 1; }
          done
